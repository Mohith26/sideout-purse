# Generated by `no-mistakes ci-workflow` from .no-mistakes.yaml, then adjusted: Node 22 with
# pnpm, a postgres:16 service container provisioned by `pnpm db:setup`, and all four gates
# (typecheck, lint, test, build). Database tests run against the two `_TEST` databases.
# Before the tests, Purse's `purse` database is migrated and seeded and the Purse API is
# started against it, so Sideout's integration walk (`apps/sideout/test/integration`) runs
# against a real Purse with the seed's sandbox key; after the tests Sideout's `sideout`
# database is migrated and seeded, which mirrors the seeded events to that Purse, and
# `reconcile` runs against Purse's ledger: a failing invariant fails the build (spec 4.2.4).
# After the build, the operator console's Playwright smoke runs the built console against
# the API on that same seeded database (spec section 8).
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: 'true'
      # Admin connection `pnpm db:setup` uses to create the roles and databases.
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Each app reads only its own variables; see docs/decisions.md (D2). Purse has two
      # roles: purse_app at runtime (append-only on the journal) and purse_migrator, the
      # owner, for migrations, seeds and the test reset.
      PURSE_DATABASE_URL: postgres://purse_app:purse_app@localhost:5432/purse
      PURSE_MIGRATOR_DATABASE_URL: postgres://purse_migrator:purse_migrator@localhost:5432/purse
      PURSE_DATABASE_URL_TEST: postgres://purse_app:purse_app@localhost:5432/purse_test
      PURSE_MIGRATOR_DATABASE_URL_TEST: postgres://purse_migrator:purse_migrator@localhost:5432/purse_test
      SIDEOUT_DATABASE_URL: postgres://sideout_app:sideout_app@localhost:5432/sideout
      SIDEOUT_DATABASE_URL_TEST: postgres://sideout_app:sideout_app@localhost:5432/sideout_test
      # Where the Purse API started below listens; Sideout's seed and integration walk reach it here.
      PURSE_API_URL: http://localhost:4000
      PURSE_INTEGRATION_API_URL: http://localhost:4000
      # The randomized ledger test runs the full count here and refuses less under CI.
      LEDGER_RANDOM_OPS: '10000'
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Provision databases
        run: pnpm db:setup --no-write-env

      - name: Typecheck
        run: |
          pnpm typecheck

      - name: Lint
        run: |
          pnpm lint

      - name: Migrate and seed Purse
        # The seed prints the sandbox keys' plaintext the one time it creates them: the secret
        # key is what Sideout's seed and integration walk call Purse with, and the publishable
        # key is what the SDK would mount flows with.
        run: |
          pnpm --filter @purse/api db:migrate
          pnpm --filter @purse/api db:seed -- --print-keys | tee purse-seed.log
          SECRET=$(grep -o '"kind":"secret"[^}]*"key":"sk_[A-Za-z0-9_]*"' purse-seed.log | grep -o 'sk_[A-Za-z0-9_]*' | head -1)
          PUBLISHABLE=$(grep -o '"kind":"publishable"[^}]*"key":"pk_[A-Za-z0-9_]*"' purse-seed.log | grep -o 'pk_[A-Za-z0-9_]*' | head -1)
          test -n "$SECRET" && test -n "$PUBLISHABLE"
          echo "::add-mask::$SECRET"
          echo "PURSE_SECRET_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "PURSE_INTEGRATION_SECRET_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "PURSE_INTEGRATION_PUBLISHABLE_KEY=$PUBLISHABLE" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_PURSE_PUBLISHABLE_KEY=$PUBLISHABLE" >> "$GITHUB_ENV"
          rm purse-seed.log

      - name: Start the Purse API
        run: |
          WEBHOOK_POLL_INTERVAL_MS=200 pnpm --filter @purse/api exec tsx src/index.ts > purse-api.log 2>&1 &
          echo $! > purse-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health > /dev/null; then echo "Purse API up"; break; fi
            if [ "$i" = 60 ]; then echo "Purse API did not start"; cat purse-api.log; exit 1; fi
            sleep 1
          done

      - name: Test
        # PURSE_SECRET_KEY is unset here on purpose: the suites run against an in-memory Purse,
        # and only the integration walk, gated on PURSE_INTEGRATION_*, reaches the real one.
        env:
          PURSE_SECRET_KEY: ''
        run: |
          pnpm test

      - name: Migrate and seed Sideout (mirrors the seeded events to Purse)
        run: |
          pnpm --filter @sideout/web db:migrate
          pnpm --filter @sideout/web db:seed
          pnpm --filter @sideout/web db:seed

      - name: Reconcile Purse ledger
        run: |
          pnpm --filter @purse/api reconcile

      - name: Stop the Purse API
        if: always()
        run: |
          if [ -f purse-api.pid ]; then kill "$(cat purse-api.pid)" || true; fi
          tail -n 40 purse-api.log || true

      - name: Build
        run: |
          pnpm build

      - name: Install the Playwright browser
        run: pnpm --filter @purse/console exec playwright install --with-deps chromium

      - name: Console end-to-end smoke
        run: pnpm --filter @purse/console e2e
