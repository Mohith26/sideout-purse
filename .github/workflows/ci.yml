# Generated by `no-mistakes ci-workflow` from .no-mistakes.yaml, then adjusted: Node 22 with
# pnpm, a postgres:16 service container provisioned by `pnpm db:setup`, and all four gates
# (typecheck, lint, test, build). Database tests run against the two `_TEST` databases.
# Before the tests, Purse's `purse` database is migrated and seeded and the Purse API is
# started against it, so Sideout's integration walk (`apps/sideout/test/integration`) runs
# against a real Purse with the seed's sandbox key; after the tests Sideout's `sideout`
# database is migrated and seeded, which mirrors the seeded events to that Purse, and
# `reconcile` runs against Purse's ledger: a failing invariant fails the build (spec 4.2.4).
# After the build, the operator console's Playwright smoke runs the built console against
# the API on that same seeded database (spec section 8), then Sideout's, then the second
# tenant's (the ping-pong ladder, docs/second-tenant.md), and the ledger is reconciled once
# more with both tenants' settlements in it.
#
# The second job, `images`, builds every container image the deployment runs, one matrix
# leg per image and in parallel with the gates above. `pnpm build` runs on a full checkout
# and so never sees what `.dockerignore` drops from the build context; an image that only
# fails there used to reach a deploy (docs/decisions.md). Building is the whole gate: the
# images are neither run nor pushed.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: 'true'
      # Admin connection `pnpm db:setup` uses to create the roles and databases.
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Each app reads only its own variables; see docs/decisions.md (D2). Purse has two
      # roles: purse_app at runtime (append-only on the journal) and purse_migrator, the
      # owner, for migrations, seeds and the test reset.
      PURSE_DATABASE_URL: postgres://purse_app:purse_app@localhost:5432/purse
      PURSE_MIGRATOR_DATABASE_URL: postgres://purse_migrator:purse_migrator@localhost:5432/purse
      PURSE_DATABASE_URL_TEST: postgres://purse_app:purse_app@localhost:5432/purse_test
      PURSE_MIGRATOR_DATABASE_URL_TEST: postgres://purse_migrator:purse_migrator@localhost:5432/purse_test
      SIDEOUT_DATABASE_URL: postgres://sideout_app:sideout_app@localhost:5432/sideout
      SIDEOUT_DATABASE_URL_TEST: postgres://sideout_app:sideout_app@localhost:5432/sideout_test
      PINGPONG_DATABASE_URL: postgres://pingpong_app:pingpong_app@localhost:5432/pingpong
      PINGPONG_DATABASE_URL_TEST: postgres://pingpong_app:pingpong_app@localhost:5432/pingpong_test
      # Where the Purse API started below listens; Sideout's seed and integration walk reach it here.
      PURSE_API_URL: http://localhost:4000
      PURSE_INTEGRATION_API_URL: http://localhost:4000
      # The randomized ledger test runs the full count here and refuses less under CI.
      LEDGER_RANDOM_OPS: '10000'
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Provision databases
        run: pnpm db:setup --no-write-env

      - name: Typecheck
        run: |
          pnpm typecheck

      - name: Lint
        run: |
          pnpm lint

      - name: Migrate and seed Purse
        # The seed prints the sandbox keys' plaintext the one time it creates them, one pair per
        # tenant, each line labelled: the secret key is what the tenant's seed and integration
        # walk call Purse with, and the publishable key is what the SDK mounts flows with.
        run: |
          pnpm --filter @purse/api db:migrate
          pnpm --filter @purse/api db:seed -- --print-keys | tee purse-seed.log
          key_of() { grep "\"label\":\"seed:$1:$2:sandbox\"" purse-seed.log | grep -o "\"key\":\"$3_[A-Za-z0-9_]*\"" | grep -o "$3_[A-Za-z0-9_]*" | head -1; }
          SECRET=$(key_of sideout secret sk)
          PUBLISHABLE=$(key_of sideout publishable pk)
          PP_SECRET=$(key_of pingpong secret sk)
          PP_PUBLISHABLE=$(key_of pingpong publishable pk)
          test -n "$SECRET" && test -n "$PUBLISHABLE" && test -n "$PP_SECRET" && test -n "$PP_PUBLISHABLE"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$PP_SECRET"
          # Named apart from PURSE_SECRET_KEY, which is Purse's own process secret.
          echo "SIDEOUT_PURSE_SECRET_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "PURSE_INTEGRATION_SECRET_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "PURSE_INTEGRATION_PUBLISHABLE_KEY=$PUBLISHABLE" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_PURSE_PUBLISHABLE_KEY=$PUBLISHABLE" >> "$GITHUB_ENV"
          # The second tenant's pair, for its seed, its integration walk and its smoke.
          echo "PINGPONG_PURSE_SECRET_KEY=$PP_SECRET" >> "$GITHUB_ENV"
          echo "PINGPONG_INTEGRATION_SECRET_KEY=$PP_SECRET" >> "$GITHUB_ENV"
          echo "PINGPONG_INTEGRATION_PUBLISHABLE_KEY=$PP_PUBLISHABLE" >> "$GITHUB_ENV"
          echo "PINGPONG_PURSE_PUBLISHABLE_KEY=$PP_PUBLISHABLE" >> "$GITHUB_ENV"
          rm purse-seed.log

      - name: Start the Purse API
        # WEBHOOK_ALLOWED_HOSTS is the destination-validation escape hatch
        # (docs/webhooks-security.md): Sideout's integration walk registers a webhook
        # endpoint on a loopback receiver, which a deployment refuses by default.
        run: |
          WEBHOOK_POLL_INTERVAL_MS=200 WEBHOOK_ALLOWED_HOSTS=localhost,127.0.0.1,::1 \
            pnpm --filter @purse/api exec tsx src/index.ts > purse-api.log 2>&1 &
          echo $! > purse-api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/health > /dev/null; then echo "Purse API up"; break; fi
            if [ "$i" = 60 ]; then echo "Purse API did not start"; cat purse-api.log; exit 1; fi
            sleep 1
          done

      - name: Test
        # The tenants' secret keys are unset here on purpose: the suites run against an in-memory
        # Purse, and only the integration walks, gated on *_INTEGRATION_*, reach the real one.
        env:
          SIDEOUT_PURSE_SECRET_KEY: ''
          PINGPONG_PURSE_SECRET_KEY: ''
        run: |
          pnpm test

      - name: Migrate and seed Sideout (mirrors the seeded events to Purse)
        run: |
          pnpm --filter @sideout/web db:migrate
          pnpm --filter @sideout/web db:seed
          pnpm --filter @sideout/web db:seed

      - name: Migrate and seed Ping-pong (links the seeded players to Purse)
        run: |
          pnpm --filter @pingpong/web db:migrate
          pnpm --filter @pingpong/web db:seed

      - name: Reconcile Purse ledger
        run: |
          pnpm --filter @purse/api reconcile

      - name: Stop the Purse API
        if: always()
        run: |
          if [ -f purse-api.pid ]; then kill "$(cat purse-api.pid)" || true; fi
          tail -n 40 purse-api.log || true

      - name: Build
        # Sideout is built with the demo-accounts switch on (docs/demo-accounts.md) so its
        # Playwright smoke below walks the picker; the deployed image is built by the host
        # from its own DEMO_ACCOUNTS build argument.
        env:
          DEMO_ACCOUNTS: 'true'
        run: |
          pnpm build

      - name: Install the Playwright browser
        run: pnpm --filter @purse/console exec playwright install --with-deps chromium

      - name: Console end-to-end smoke
        run: pnpm --filter @purse/console e2e

      - name: Sideout end-to-end smoke
        # The built app against a Purse API on the seeded databases: every screen at 390, 768 and
        # 1280 with screenshots, axe, the keyboard walks and the offline score queue. The Purse keys
        # come from the seed step above; the run supplies its own SESSION_SECRET.
        run: |
          pnpm --filter @sideout/web exec playwright install --with-deps chromium
          pnpm --filter @sideout/web e2e

      - name: Ping-pong end-to-end smoke
        # The second tenant's built app against a Purse API on the seeded databases: two players,
        # one confirmed result, the ladder reorders, the season closes and the payouts land.
        run: |
          pnpm --filter @pingpong/web e2e

      - name: Reconcile Purse ledger after both tenants settled
        run: |
          pnpm --filter @purse/api reconcile

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sideout-screenshots
          path: docs/screenshots
          if-no-files-found: ignore

  # Every image `docs/deploy.md` deploys, built from the repository root against the real
  # `.dockerignore` build context. `test/docker.test.ts` asserts this matrix names every
  # Dockerfile in the repository, so a new service cannot skip the gate. The layer cache is
  # per image (`scope`), so an unrelated change reuses the installs and the builds.
  images:
    name: Build the ${{ matrix.service }} image
    runs-on: ubuntu-latest

    strategy:
      # One failing image must not cancel the others: the point is to see every one.
      fail-fast: false
      matrix:
        include:
          - service: purse
            dockerfile: apps/purse/Dockerfile
          - service: purse-console
            dockerfile: apps/purse-console/Dockerfile
          - service: sideout
            dockerfile: apps/sideout/Dockerfile
            # The deployed Sideout build carries the demo-accounts switch (docs/demo-accounts.md).
            args: DEMO_ACCOUNTS=true
          - service: pingpong
            dockerfile: apps/pingpong/Dockerfile
          - service: demo-reset
            dockerfile: docker/demo-reset/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Nothing is pushed and nothing is loaded into the daemon: the build is the gate.
          push: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            ${{ matrix.args }}
          cache-from: type=gha,scope=image-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.service }}
