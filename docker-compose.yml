# One Postgres 16 instance, two logical databases (decision D2). The init script creates
# the `purse` and `sideout` databases (plus their `_test` twins) and the `purse_app` /
# `sideout_app` roles, each able to connect only to its own database.
#
#   docker compose up -d
#   cp apps/purse/.env.example apps/purse/.env && cp apps/sideout/.env.example apps/sideout/.env
#   pnpm db:migrate && pnpm db:seed
#
# Without Docker, `pnpm db:setup` performs the same provisioning against any Postgres you
# can reach as an admin (for example a Homebrew install on localhost:5432).
services:
  postgres:
    image: postgres:16
    container_name: sideout-purse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # Application role passwords; local defaults, override in a shell for anything shared.
      PURSE_DB_PASSWORD: ${PURSE_DB_PASSWORD:-purse_app}
      SIDEOUT_DB_PASSWORD: ${SIDEOUT_DB_PASSWORD:-sideout_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
