# Generated by `no-mistakes ci-workflow` from .no-mistakes.yaml, then adjusted: Node 22 with
# pnpm, a postgres:16 service container provisioned by `pnpm db:setup`, and all four gates
# (typecheck, lint, test, build). Database tests run against the two `_TEST` databases.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI: 'true'
      # Admin connection `pnpm db:setup` uses to create the roles and databases.
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Each app reads only its own variable; see docs/decisions.md (D2).
      PURSE_DATABASE_URL_TEST: postgres://purse_app:purse_app@localhost:5432/purse_test
      SIDEOUT_DATABASE_URL_TEST: postgres://sideout_app:sideout_app@localhost:5432/sideout_test
      BUILD_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Provision databases
        run: pnpm db:setup --no-write-env

      - name: Typecheck
        run: |
          pnpm typecheck

      - name: Lint
        run: |
          pnpm lint

      - name: Test
        run: |
          pnpm test

      - name: Build
        run: |
          pnpm build
